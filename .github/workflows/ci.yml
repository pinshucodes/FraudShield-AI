name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests (FastAPI & Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET_KEY: "testsecretkey"
        run: |
          cd apps/api
          pytest -v > pytest_log.txt 2>&1 || (git config --global user.name 'github-actions[bot]' && git config --global user.email 'github-actions[bot]@users.noreply.github.com' && git checkout -b ci-logs && git add pytest_log.txt && git commit -m 'Upload pytest log' && git push origin ci-logs -f && exit 1)
  frontend-check:
    name: Frontend Build & Lint (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          cd apps/web
          npm install --legacy-peer-deps

      - name: Run Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd apps/web
          npm run build > build_log.txt 2>&1 || (git config --global user.name 'github-actions[bot]' && git config --global user.email 'github-actions[bot]@users.noreply.github.com' && git checkout -b ci-logs-frontend && git add build_log.txt && git commit -m 'Upload frontend build log' && git push origin ci-logs-frontend -f && exit 1)
