name: MLOps Automated Retraining Pipeline

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allows manual triggering from GitHub UI

jobs:
  retrain-model:
    name: Retrain XGBoost & LightGBM Models
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: 'apps/api/requirements.txt'

      - name: Install Dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Model Retraining Pipeline
        run: |
          python -m ml.src.pipeline --version "auto-v${{ github.run_number }}"

      - name: Upload Trained Model Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-ml-models-v${{ github.run_number }}
          path: ml/models/
          retention-days: 30
